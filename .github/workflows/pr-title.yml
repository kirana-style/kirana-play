name: pr-title

# Pull requests are squash-merged, so the title becomes the one commit on main. It must be a
# Conventional Commit, as in every Kirana repository, so the history is ready for the registry's
# version and changelog when they arrive:
#
#   feat: …       a new feature
#   fix: …        a bug fix
#   feat!: …      a breaking change
#   perf, docs, deps                       → listed in a changelog
#   refactor, test, build, ci, chore       → not listed

# `title` is a required check, so it must report in the merge queue too; there the pull request's
# title was checked before it was queued, and the queue cannot change it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-26.04
    steps:
      - if: github.event_name == 'merge_group'
        run: echo "Checked on the pull request before it was queued."

      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            deps
            refactor
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            Start the subject in lower case and leave off the full stop, e.g. "fix: keep sx last when merging".
