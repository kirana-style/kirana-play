name: site

# The `play` Cloudflare Worker (wrangler.jsonc): deployed on every push to main, and uploaded
# as a preview version, with its own URL, for every pull request from a branch of this repository.
#
# Why here and not Cloudflare's Git integration (Workers Builds), which would also work now that the
# engine comes from npm: this deploys exactly the build CI tested, without a third-party app on the
# organization, the same way the Kirana site and kirana-ui deploy.
#
# Until the custom domain is added it answers at https://play.kirana-style.workers.dev. The `site`
# environment (deployment branches: main) and the `preview` environment hold the Cloudflare token
# and account id.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The newest push wins, but a deploy already running finishes.
    concurrency:
      group: play
      cancel-in-progress: false
    environment:
      name: site
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build
        run: vp run build

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=${url:-https://play.kirana.style}" >> "$GITHUB_OUTPUT"

  # A pull request from a fork gets no secrets, so it gets no preview.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build
        run: vp run build

      # A new version of the Worker that production does not serve, reachable at
      # https://pr-<number>-play.<subdomain>.workers.dev while the alias points at it.
      - name: Upload a preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          bunx wrangler versions upload --preview-alias "$ALIAS" | tee upload.log
          url=$(grep -oE "https://${ALIAS}-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Preview: ${url:-see the log above}" >> "$GITHUB_STEP_SUMMARY"
